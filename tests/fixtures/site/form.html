<!doctype html><html lang="en"><meta charset="utf-8"><title>Contact fixture</title><body><h1>Contact the solar team</h1><form aria-label="Contact team"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Message<textarea name="message"></textarea></label><label>Topic<select name="topic"><option>Maintenance</option><option>Pricing</option></select></label><button type="submit">Send message</button></form><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('h1').textContent='Message sent'});</script></body></html>
